server:
  port: 8081

spring:
  application:
    name: ms-gymflow-reservations
  # Amazon RDS PostgreSQL. Nada de secretos aquí: todo llega por variables de entorno (.env en la EC2).
  #  - DB_URL: jdbc:postgresql://<endpoint-rds>:5432/gymflow?sslmode=require
  #  - DB_USERNAME y DB_PASSWORD: credenciales de la instancia (la contraseña solo en el .env de la EC2)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    # Las entidades no se exponen fuera de la transacción: los servicios devuelven DTO.
    open-in-view: false
    hibernate:
      # "update" crea las tablas la primera vez. Se puede pasar a "validate" con JPA_DDL_AUTO una vez creado el esquema.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # RabbitMQ (clúster de 2 nodos en ec2-mq). Se listan los dos nodos: si uno no responde, se usa el otro.
  #  - RABBITMQ_ADDRESSES: <ip-privada-ec2-mq>:5672,<ip-privada-ec2-mq>:5673
  #  - RABBITMQ_USERNAME y RABBITMQ_PASSWORD: la contraseña solo en el .env de la EC2
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USERNAME:gymflow}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 5s
    # RabbitMQ confirma cada mensaje recibido (ack del broker) y devuelve los que no tienen cola de destino
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1000
        multiplier: 2.0
        max-attempts: 3

gymflow:
  services:
    # Nombre del contenedor en la red interna de Docker Compose
    catalog-url: ${CATALOG_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # RabbitMQ no entra en el health: si el broker se cae, las reservas siguen funcionando (la notificación es
  # asíncrona y no debe bloquear el core). Además, el healthcheck de Compose y el arranque del BFF dependen de este health.
  health:
    rabbit:
      enabled: false
