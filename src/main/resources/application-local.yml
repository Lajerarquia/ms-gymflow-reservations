# Perfil local: H2 en memoria, sin necesidad de Oracle. Necesita catalog corriendo (CATALOG_URL).
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:mem:reservas;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
